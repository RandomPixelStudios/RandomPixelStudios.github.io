name: Update download count

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch download count from Modrinth
        run: |
          n=$(curl -sf https://api.modrinth.com/v2/project/x-to-xray | jq -e '.downloads')
          echo "{\"downloads\":$n}" > assets/downloads.json
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git -c user.name=RandomPixelStudios -c user.email=randompixxelstudios@gmail.com commit -am "Update download count"
          git push
